[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi-csi-rx"
version = "0.5.0"
description = "Standalone Nexmon CSI capture with SQLite storage and optional plain TCP forwarding"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["python-dotenv>=1.0,<2"]

[project.scripts]
csi-extractor = "nexmon_capture.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nexmon_capture*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
